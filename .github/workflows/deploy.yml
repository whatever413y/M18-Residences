# main is production: every push is checked, run through the browser e2e suite against the server and the other app
# as they are live, and only then deployed (https://my.m18-residences.workers.dev).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    uses: whatever413y/.github/.github/workflows/flutter-web-app-check.yml@v1

  e2e:
    needs: check
    uses: whatever413y/shared-e2e/.github/workflows/m18-residences.yml@main
    with:
      server_ref: live
      tenant_ref: ${{ github.sha }}
      admin_ref: live
      pinned: true

  deploy:
    needs: e2e
    permissions:
      contents: write
    uses: whatever413y/.github/.github/workflows/workers-deploy-web.yml@v1
    with:
      site-url: https://my.m18-residences.workers.dev
